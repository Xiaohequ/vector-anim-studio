name: vector_anim_studio
description: "Studio d'animation vectorielle mobile : formes, couches, keyframes, export MP4/GIF."
publish_to: 'none'

version: 0.16.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Persistance locale des projets
  sqflite: ^2.4.4
  path: ^1.9.1
  path_provider: ^2.1.6
  # Partage des exports (MP4 / GIF / PNG / JSON)
  share_plus: ^13.3.0
  # Encodage GIF animé (pur Dart)
  image: ^4.10.1
  # Encodage MP4 H.264 via MediaCodec / AVFoundation (aucun ffmpeg embarqué)
  flutter_quick_video_encoder: ^1.7.2
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # Base SQLite pour les tests sur machine hôte
  sqflite_common_ffi: ^2.4.3
  # Faux fichiers du sélecteur dans les tests (PlatformFile.xFile)
  cross_file: ^0.3.5+4

flutter:
  uses-material-design: true
