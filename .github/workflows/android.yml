name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_to_play:
        description: Publier explicitement la version courante en production
        required: false
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    outputs:
      version: ${{ steps.version.outputs.value }}
      play_publish_enabled: ${{ steps.play-config.outputs.enabled }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version de Flutter
        run: flutter --version

      - name: Version de l'application
        id: version
        working-directory: .
        run: |
          version=$(grep '^version:' app/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Détecter si cette exécution doit publier sur Google Play
        id: play-config
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          MANUAL_PUBLISH: ${{ inputs.publish_to_play }}
        run: |
          requested=false
          current_version=$(grep '^version:' app/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if [ "$EVENT_NAME" = 'push' ] && [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != '0000000000000000000000000000000000000000' ]; then
            previous_version=$(git show "$EVENT_BEFORE:app/pubspec.yaml" | grep '^version:' | awk '{print $2}' | cut -d'+' -f1)
            if [ "$current_version" != "$previous_version" ]; then requested=true; fi
          elif [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$MANUAL_PUBLISH" = 'true' ]; then
            requested=true
          fi

          if [ "$requested" != 'true' ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Version inchangée : publication Play automatique ignorée. Pour republier, relancer manuellement avec publish_to_play=true.' >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'Publication Google Play Production activée.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Secret PLAY_SERVICE_ACCOUNT_JSON absent : publication Play ignorée.'
            echo 'La publication Play Production est ignorée : configurez le secret PLAY_SERVICE_ACCOUNT_JSON.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Dépendances
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Préparer la clé d'envoi Play
        if: github.event_name != 'pull_request'
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$PLAY_UPLOAD_KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/play-signing"
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/play-signing/upload-keystore.jks"
          chmod 600 "$RUNNER_TEMP/play-signing/upload-keystore.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/play-signing/upload-keystore.jks
          storePassword=$PLAY_UPLOAD_STORE_PASSWORD
          keyAlias=$PLAY_UPLOAD_KEY_ALIAS
          keyPassword=$PLAY_UPLOAD_KEY_PASSWORD
          EOF
          chmod 600 android/key.properties

      - name: Build APK + AAB release
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Préparer les artefacts
        working-directory: .
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk \
             "dist/vector-anim-studio-${{ steps.version.outputs.value }}.apk"
          cp app/build/app/outputs/bundle/release/app-release.aab \
             "dist/vector-anim-studio-${{ steps.version.outputs.value }}.aab"

      - name: Upload APK + AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundles
          path: dist/*
          if-no-files-found: error

      - name: Nettoyer la clé d'envoi
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/play-signing/upload-keystore.jks"

  release:
    name: Publier la release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Récupérer l'APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-bundles
          path: dist

      - name: Préparer les notes de release
        run: |
          mkdir -p dist
          {
            cat RELEASE_NOTES.md
            echo
            echo '---'
            echo
            echo "_Version ${{ needs.build.outputs.version }} · build #${{ github.run_number }} · commit \`${{ github.sha }}\` · $(date -u '+%Y-%m-%d %H:%M UTC')_"
          } > dist/release_notes.md
          echo '--- notes générées ---'
          cat dist/release_notes.md

      - name: Créer la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-build{1}', needs.build.outputs.version, github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Keyform Studio {0} — build {1}', needs.build.outputs.version, github.run_number) }}
          body_path: dist/release_notes.md
          files: |
            dist/*.apk
            dist/*.aab
          generate_release_notes: false
          draft: false
          prerelease: false

  publish_play_production:
    name: Publier sur Google Play Production
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.build.outputs.play_publish_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Télécharger l'AAB signé
        uses: actions/download-artifact@v4
        with:
          name: app-release-bundles
          path: dist

      - name: Publier l'AAB en production
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: fr.xqu.vector_anim_studio
          releaseFiles: dist/vector-anim-studio-${{ needs.build.outputs.version }}.aab
          tracks: production
          status: completed
          releaseName: ${{ needs.build.outputs.version }}
          whatsNewDirectory: distribution/whatsnew

  play-publication-summary:
    name: Résumé de publication Play
    needs: [build, publish-play-production]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Résumer le résultat
        env:
          PLAY_REQUESTED: ${{ needs.build.outputs.play_publish_enabled }}
          PLAY_RESULT: ${{ needs.publish_play_production.result }}
        run: |
          {
            echo '## Publication Google Play'
            if [ "$PLAY_REQUESTED" != 'true' ]; then
              echo '- Non publiée : PLAY_SERVICE_ACCOUNT_JSON non configuré ou aucune nouvelle version détectée.'
            elif [ "$PLAY_RESULT" = 'success' ]; then
              echo '- AAB envoyé à la piste Production. Suivre le statut de la publication dans Google Play Console.'
            else
              echo "- Échec de la publication Play (résultat du job : $PLAY_RESULT). Voir les logs du job Publier sur Google Play Production."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
